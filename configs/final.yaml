# Q3.6 final model (<= 1e17 FLOPs), trained from scratch.
# Architecture fixed to the Q3.5 reported config (dim 128, 8 layers, 8 heads, 4 kv heads,
# max_seq_len 256); only steps / batch / LR change.
output_dir: outputs/final
model_config:
  dim: 128
  n_layers: 8
  n_heads: 8
  n_kv_heads: 4
  max_seq_len: 256
  multiple_of: 32
  dropout: 0.0
device: auto
precision: auto
batch_size: 32                 # micro-batch; 128 OOMs on a T4 (32000-vocab logits)
seq_len: 256
num_warmup_steps: 2000
num_training_steps: 83380
grad_accumulation_steps: 4     # effective batch = 32 * 4 = 128
min_lr: 3.0e-4
max_lr: 3.0e-3
